name: MacOS Release (ankuper).
run-name: MacOS Release (ankuper) — ${{ github.event.head_commit.message || 'manual dispatch' }}

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'macos-latest'
        description: 'GitHub Actions runner label (e.g. macos-latest, macos-13)'
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/mac-binary-ankuper.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
  workflow_dispatch:

jobs:

  macos:
    name: MacOS Release (unsigned)
    runs-on: ${{ inputs.runner || 'macos-latest' }}

    env:
      GIT: "https://github.com"
      CMAKE_GENERATOR: "Ninja"
      CMAKE_BUILD_TYPE: "Release"
      CMAKE_BUILD_PARALLEL_LEVEL: ""
      TDE2E: "51743dfd01dff6179e2d8f7095729caa4e2222e9"
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      MANUAL_CACHING: "1"
      AUTO_CACHING: "1"
      # Consume the prebuilt libteleproto3 from the teleproto3 release instead of
      # building it from source (release artifacts are the single source of truth).
      LIBTELEPROTO3_TAG: "lib-v0.8.0"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}
          fetch-depth: 0

      - name: Fetch prebuilt libteleproto3 (release ${{ env.LIBTELEPROTO3_TAG }}).
        # tdesktop's CMakeLists assumes teleproto3 at ${CMAKE_SOURCE_DIR}/../../teleproto3
        # (here ../teleproto3, a workspace sibling) with:
        #   lib/build/libteleproto3.a  (default LIBTELEPROTO3_LIB_PATH — this workflow
        #                               does NOT override it, so the default applies)
        #   lib/include/               (headers)
        #   spec/ux-strings.yaml       (Type3 codegen)
        # Download + extract the prebuilt macOS (arm64, macos-latest runner) artifact
        # instead of building from source. lib-v0.8.0 ships the t3_client_* API
        # (T3_BUILD_CLIENT). Archive layout is ./lib/{libteleproto3.a,include/} +
        # ./spec/...; copy the static lib to the cmake-expected lib/build/.
        run: |
          mkdir -p ../teleproto3
          curl -fL --retry 3 \
            "https://github.com/ankuper/teleproto3/releases/download/${LIBTELEPROTO3_TAG}/libteleproto3-macos-arm64.tar.gz" \
            -o /tmp/libteleproto3.tar.gz
          tar -xzf /tmp/libteleproto3.tar.gz -C ../teleproto3
          mkdir -p ../teleproto3/lib/build
          cp ../teleproto3/lib/libteleproto3.a ../teleproto3/lib/build/libteleproto3.a
          ls -la ../teleproto3/lib/build/libteleproto3.a ../teleproto3/lib/include ../teleproto3/spec/ux-strings.yaml
          # Export T3_ROOT so the build step's -DLIBTELEPROTO3_ROOT / -DLIBTELEPROTO3_LIB_PATH resolve.
          T3_ROOT=$(cd ../teleproto3 && pwd)
          echo "T3_ROOT=$T3_ROOT" >> $GITHUB_ENV

      - name: First set up.
        run: |
          brew update
          brew upgrade || true
          brew install ada-url autoconf automake boost cmake ffmpeg@6 jpeg-xl libavif libheif libtool minizip openal-soft openh264 openssl opus ninja pkg-config python qtbase qtimageformats qtshadertools qtsvg xz || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          # brew --prefix differs between Apple Silicon (/opt/homebrew) and Intel (/usr/local)
          BREW_PREFIX=$(brew --prefix)
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' \
            "$BREW_PREFIX/share/cmake/Modules/Compiler/GNU.cmake"

          # CMAKE_PREFIX_PATH for brew-installed dependencies — arch-specific
          echo "CMAKE_PREFIX_PATH=$BREW_PREFIX/opt/ffmpeg@6:$BREW_PREFIX/opt/openal-soft" >> $GITHUB_ENV
          # RUNNER_ARCH_LOWER: arm64 or x86_64 — used in artifact names
          echo "RUNNER_ARCH_LOWER=$(uname -m)" >> $GITHUB_ENV

          xcodebuild -version > CACHE_KEY.txt
          brew list --versions >> CACHE_KEY.txt
          echo $MANUAL_CACHING >> CACHE_KEY.txt
          if [ "$AUTO_CACHING" = "1" ]; then
            thisFile=$REPO_NAME/.github/workflows/mac-binary-ankuper.yml
            echo `md5 -q $thisFile` >> CACHE_KEY.txt
          fi
          echo "CACHE_KEY=`md5 -q CACHE_KEY.txt`" >> $GITHUB_ENV

          echo "MACOSX_DEPLOYMENT_TARGET=$(grep 'set(QT_SUPPORTED_MIN_MACOS_VERSION' \
            "$BREW_PREFIX/Cellar/qtbase/"*/lib/cmake/Qt6/Qt6ConfigExtras.cmake | \
            sed -E 's/^.*"(.*)"\)$/\1/')" >> $GITHUB_ENV
          echo "LibrariesPath=`pwd`" >> $GITHUB_ENV

          echo "RNNOISE=`curl -sSL --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' https://api.github.com/repos/xiph/rnnoise/git/refs/heads/master | jq -r .object.sha`" >> $GITHUB_ENV
          echo "WEBRTC=`curl -sSL --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' https://api.github.com/repos/desktop-app/tg_owt/git/refs/heads/master | jq -r .object.sha`" >> $GITHUB_ENV

      - name: RNNoise cache.
        id: cache-rnnoise
        uses: actions/cache@v5
        with:
          path: ${{ env.LibrariesPath }}/local/rnnoise
          key: ${{ runner.OS }}-rnnoise-${{ env.RNNOISE }}-${{ env.CACHE_KEY }}
      - name: RNNoise.
        if: steps.cache-rnnoise.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath
          git clone --depth=1 $GIT/xiph/rnnoise.git
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=$LibrariesPath/local/rnnoise --disable-examples --disable-doc
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: WebRTC cache.
        id: cache-webrtc
        uses: actions/cache@v5
        with:
          path: ${{ env.LibrariesPath }}/local/tg_owt
          key: ${{ runner.OS }}-webrtc-${{ env.WEBRTC }}-${{ env.CACHE_KEY }}
      - name: WebRTC.
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath
          git clone --depth=1 --recursive --shallow-submodules $GIT/desktop-app/tg_owt.git
          cd tg_owt
          cmake -Bbuild . -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tg_owt
          cmake --build build
          cmake --install build

      - name: TDE2E cache.
        id: cache-tde2e
        uses: actions/cache@v5
        with:
          path: ${{ env.LibrariesPath }}/local/tde2e
          key: ${{ runner.OS }}-tde2e-${{ env.TDE2E }}-${{ env.CACHE_KEY }}
      - name: TDE2E.
        if: steps.cache-tde2e.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath
          git init tde2e
          cd tde2e
          git remote add origin $GIT/tdlib/td.git
          git fetch --depth=1 origin $TDE2E
          git reset --hard FETCH_HEAD
          cmake -Bbuild . -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tde2e -DTD_E2E_ONLY=ON
          cmake --build build
          cmake --install build

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        env:
          TDESKTOP_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          T3_DEFAULT_PROXY_SECRET: ${{ secrets.T3_DEFAULT_PROXY_SECRET }}
        run: |
          cd $REPO_NAME
          export CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH$(find $LibrariesPath/local -mindepth 1 -maxdepth 1 -type d -exec printf ':%s' {} +)"
          if [ -z "$T3_DEFAULT_PROXY_SECRET" ]; then
            echo "::warning::T3_DEFAULT_PROXY_SECRET secret is empty — build will ship WITHOUT a default proxy."
          fi

          cmake -Bbuild . \
            -DCMAKE_BUILD_TYPE=Release \
            -DTDESKTOP_API_TEST=OFF \
            -DTDESKTOP_API_ID=$TDESKTOP_API_ID \
            -DTDESKTOP_API_HASH=$TDESKTOP_API_HASH \
            -DT3_PROXY_SERVER=arctic-breeze.my.id \
            -DT3_PROXY_PORT=443 \
            -DT3_PROXY_SECRET="$T3_DEFAULT_PROXY_SECRET" \
            -DLIBTELEPROTO3_ROOT="$T3_ROOT" \
            -DLIBTELEPROTO3_LIB_PATH="$T3_ROOT/lib/libteleproto3.a" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

          cmake --build build
          APP_BUNDLE=$(find build -maxdepth 1 -name "*.app" | head -1)
          echo "APP_BUNDLE=$APP_BUNDLE" >> $GITHUB_ENV
          macdeployqt "$APP_BUNDLE"
          codesign --remove-signature "$APP_BUNDLE"

      - name: Package DMG.
        run: |
          # APP_BUNDLE is relative to REPO_NAME (e.g. "build/T3ChatM.app");
          # use REPO_NAME prefix so we can stay in GITHUB_WORKSPACE.
          APP_NAME=$(basename "${{ env.APP_BUNDLE }}" .app)
          DMG="$REPO_NAME/build/${APP_NAME}-unsigned.dmg"
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "$REPO_NAME/${{ env.APP_BUNDLE }}" \
            -ov -format UDZO "$DMG"
          ls -lh "$DMG"
          echo "DMG_PATH=$DMG" >> $GITHUB_ENV
          echo "DMG_NAME=${APP_NAME}-unsigned.dmg" >> $GITHUB_ENV

      - name: Upload .dmg artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-macOS-${{ env.RUNNER_ARCH_LOWER }}-unsigned-dmg
          path: ${{ env.DMG_PATH }}
          retention-days: 1

      - name: Upload .app artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-macOS-${{ env.RUNNER_ARCH_LOWER }}-unsigned-app
          path: ${{ env.REPO_NAME }}/${{ env.APP_BUNDLE }}
          retention-days: 1
