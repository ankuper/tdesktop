name: Windows Release (ankuper).
run-name: Windows Release (ankuper) — ${{ github.event.head_commit.message || 'manual dispatch' }}

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win-binary-ankuper.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:

jobs:
  windows:
    name: Windows Release (unsigned, x64, Qt6)
    runs-on: windows-2022

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone tdesktop.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Clone teleproto3 (sibling).
        uses: actions/checkout@v6
        with:
          repository: ankuper/teleproto3
          path: ${{ env.TBUILD }}\teleproto3
          fetch-depth: 1

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "ankuper" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "ci@ankuper"
          git config --global user.name "ankuper-ci"

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-

      - name: Free up disk space (remove preinstalled tools).
        shell: pwsh
        run: |
          # windows-latest ships with 14 GB disk and 30+ GB of preinstalled
          # tools we don't need. prepare/win.bat builds Qt+FFmpeg+OpenSSL in
          # both Debug+Release and otherwise runs out of disk. Remove the big
          # hitters before the long build step.
          $before = (Get-PSDrive C).Free / 1GB
          Write-Host "Free space before cleanup: $([math]::Round($before, 1)) GB"

          $paths = @(
            'C:\Android',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\node',
            'C:\hostedtoolcache\windows\stack',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\Java_Adopt_jdk',
            'C:\hostedtoolcache\windows\Java_Zulu_jdk',
            'C:\Program Files\MongoDB',
            'C:\Program Files\MySQL',
            'C:\Program Files (x86)\WiX Toolset v3.14',
            'C:\Program Files (x86)\Microsoft Service Fabric',
            'C:\Program Files\Microsoft Service Fabric',
            'C:\Program Files\Microsoft SDKs\Azure',
            'C:\Program Files\Amazon',
            'C:\Program Files\Google',
            'C:\Program Files\Mozilla Firefox',
            'C:\Program Files\R',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\Unity Hub',
            'C:\Program Files\dotnet\sdk\NuGetFallbackFolder',
            'C:\ProgramData\chocolatey\lib\maven',
            'C:\ProgramData\chocolatey\lib\pulumi',
            'C:\Program Files\ImageMagick-7.1.2-Q16-HDRI',
            'C:\Program Files\LLVM',
            'C:\Program Files (x86)\LLVM',
            'C:\Program Files (x86)\Android'
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Removing $p"
              Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          $after = (Get-PSDrive C).Free / 1GB
          Write-Host "Free space after cleanup:  $([math]::Round($after, 1)) GB (freed $([math]::Round($after - $before, 1)) GB)"

      - name: Libraries (Qt6 + FFmpeg + OpenSSL + ...).
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Locate OpenSSL from prepare output.
        shell: pwsh
        run: |
          # prepare/win.bat builds OpenSSL under %LibrariesPath%\openssl3\ with
          # non-standard layout: include\openssl\ for headers, out\ for Release libs.
          $root = "$env:LibrariesPath\openssl3"
          if (-not (Test-Path "$root\include\openssl\opensslv.h")) {
            Write-Error "OpenSSL headers not found at $root\include\openssl\opensslv.h. Listing for diagnosis:"
            Get-ChildItem -Path $env:LibrariesPath -Recurse -Filter "opensslv.h" -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          if (-not (Test-Path "$root\out\libcrypto.lib")) {
            Write-Error "libcrypto.lib not found at $root\out\libcrypto.lib"
            Get-ChildItem -Path $env:LibrariesPath -Recurse -Filter "libcrypto.lib" -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          echo "OPENSSL3_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OpenSSL located at $root (include=$root\include, libs=$root\out)"

      - name: libteleproto3 build (MSVC x64, against tdesktop's OpenSSL, /MT).
        if: env.ONLY_CACHE == 'false'
        shell: cmd
        run: |
          cd %TBUILD%\teleproto3\lib
          cmake -B build -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DT3_BUILD_TESTS=OFF ^
            -DOPENSSL_INCLUDE_DIR="%OPENSSL3_DIR%\include" ^
            -DOPENSSL_CRYPTO_LIBRARY="%OPENSSL3_DIR%\out\libcrypto.lib" ^
            -DOPENSSL_SSL_LIBRARY="%OPENSSL3_DIR%\out\libssl.lib"
          cmake --build build --parallel
          if not exist build\teleproto3.lib (
            echo FAIL: teleproto3.lib not produced
            dir build
            exit /b 1
          )
          echo LIBTELEPROTO3_LIB_PATH=%TBUILD%\teleproto3\lib\build\teleproto3.lib>>%GITHUB_ENV%

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        env:
          TDESKTOP_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
            qt6 ^
            -G "Ninja Multi-Config" ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D TDESKTOP_API_TEST=OFF ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -D LIBTELEPROTO3_ROOT=%TBUILD%\teleproto3 ^
            -D LIBTELEPROTO3_LIB_PATH=%LIBTELEPROTO3_LIB_PATH% ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config Release --parallel

      - name: Stage artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          rem Brand renames the main exe (T3ChatM.exe), so move every .exe rather
          rem than assuming "Telegram.exe". PDBs are excluded (multi-GB, not needed
          rem for the download).
          for %%f in ("%OUT%\*.exe") do move "%%f" artifact\
          dir artifact\
          if not exist artifact\*.exe (
            echo FAIL: no .exe staged from %OUT%
            dir %OUT%
            exit /b 1
          )

      - name: Upload artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Telegram-windows-x64-release-unsigned
          path: artifact\
          retention-days: 30
