# Story 2-7 AC#5 — WCAG 2.1 AA audit gate (Linux).
#
# Runs pa11y against three views (import dialog, proxy list, C1
# indicator) under a 2x2 locale x reduced-motion matrix. The Qt
# AT-SPI bridge is enabled so pa11y walks a non-empty a11y tree.
#
# Aggregate-only output per Epic 2 §9. Permissions: contents: read.
#
# v0.1.0 dev: the workflow is wired but the actual run requires the
# full tdesktop build to be present in the runner — gated on a build
# job from `linux.yml` or `appimage-reproducible.yml`. This file
# currently runs the audit in dry-mode against a staged build, and
# the gate becomes load-bearing once the first concrete pa11y run
# replaces the zeros in baselines/2-7-a11y-linux.yml.

name: WCAG 2.1 AA audit (Linux)

on:
  push:
    tags:
      - 'v2-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
  pull_request:
    paths:
      - 'Telegram/SourceFiles/ui/proxy_indicator_c1.*'
      - 'Telegram/SourceFiles/boxes/connection_box.*'
      - 'docs/a11y-audit-linux.md'
      - 'baselines/2-7-a11y-linux.yml'
      - '.github/workflows/a11y-audit-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    name: pa11y / 2x2 matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        locale: [en-US, fa-IR]
        reduced_motion: ['off', 'on']
    env:
      QT_LINUX_ACCESSIBILITY_ALWAYS_ON: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install AT-SPI + pa11y
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb at-spi2-core dbus-x11 \
            qt6-base-dev qt6-tools-dev \
            libxkbcommon0 libxkbcommon-x11-0
          sudo npm install -g pa11y@7 || sudo npm install -g pa11y

      - name: Stage tdesktop build artefact
        run: |
          # Production: download from sibling job in linux.yml or
          # appimage-reproducible.yml. v0.1.0 dev: stub.
          mkdir -p out/Release
          if [ ! -x out/Release/Telegram ]; then
            cat > out/Release/Telegram <<'EOF'
          #!/bin/sh
          # Stub Telegram binary for a11y-audit-linux.yml dev mode.
          # Real audit replaces this with the linked binary from
          # linux.yml's build artefact (TODO: actions/download-artifact).
          exec /bin/true
          EOF
            chmod +x out/Release/Telegram
          fi

      - name: Run pa11y under xvfb (2x2 matrix cell)
        env:
          LOCALE: ${{ matrix.locale }}
          REDUCED_MOTION: ${{ matrix.reduced_motion }}
        run: |
          set -euo pipefail
          mkdir -p out/a11y
          # AT-SPI bus must be live before launching tdesktop.
          eval "$(dbus-launch --sh-syntax)"
          /usr/libexec/at-spi-bus-launcher --launch-immediately &
          sleep 1
          # TODO(story-2-7-followup): integrate real pa11y target
          # selection (the import-dialog launches via a `--a11y-test`
          # CLI flag added to tdesktop). For v0.1.0 the cell emits an
          # empty-but-valid pa11y JSON to keep the schema-validating
          # downstream gate honest.
          [[ -n "${DBUS_SESSION_BUS_PID:-}" ]] && kill "$DBUS_SESSION_BUS_PID" 2>/dev/null || true
          cat > "out/a11y/${LOCALE}-${REDUCED_MOTION}.json" <<'EOF'
          {
            "documentTitle": "Stub a11y run",
            "pageUrl": "stub",
            "issues": []
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: a11y-${{ matrix.locale }}-${{ matrix.reduced_motion }}
          path: out/a11y/

  aggregate:
    name: aggregate + gate
    runs-on: ubuntu-24.04
    needs: a11y
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Compute baseline
        run: |
          set -euo pipefail
          total_checks=0
          total_violations=0
          total_exempt=0
          for f in artefacts/a11y-*/*.json; do
            issues="$(jq '.issues | length' "$f")"
            total_checks=$((total_checks + 1))
            total_violations=$((total_violations + issues))
          done
          # Read exemption count from the docs file (manual curation;
          # the doc carries the exempt-with-justification list).
          total_exempt="$(awk '/^- \[WCAG/ {c++} END {print c+0}' docs/a11y-audit-linux.md)"
          gate=$((total_violations - total_exempt))
          if [ "$gate" -gt 0 ]; then
            echo "FAIL: $gate unjustified WCAG violations"
            exit 1
          fi
          echo "OK: $total_violations violations, $total_exempt exempt-with-justification"

          # Write refreshed baseline for step-summary inspection.
          # NOTE: intentionally ephemeral — contents:read prevents any commit;
          # the file appears only in the step log for manual review.
          today="$(date -u +%Y-%m-%d)"
          tool_v="$(pa11y --version 2>/dev/null | head -1 || echo unknown)"
          cat > baselines/2-7-a11y-linux.yml <<EOF
# Story 2-7 AC#5 — WCAG 2.1 AA audit baseline (Linux).
# Auto-generated by .github/workflows/a11y-audit-linux.yml.

wcag_total_checks: $total_checks
wcag_violations: $total_violations
wcag_exempted_with_justification: $total_exempt
tool_name: pa11y
tool_version: $tool_v
audit_date: $today
locale_set:
  - en-US
  - fa-IR
reduced_motion_set:
  - off
  - on
EOF
