# Story 2-7 AC#1 — reproducible AppImage build verification.
#
# Runs the AppImage build twice on two distinct runner classes and
# asserts byte-identical SHA-256 on the resulting Telegram-x86_64-v2.AppImage.
#
# A divergence is a hard fail: either the toolchain pin slipped, an unpinned
# input snuck in, or filesystem/locale drift went unmasked.
#
# Permissions: contents: read ONLY (Epic 1 style-guide §13). This workflow
# does NOT push, open PRs, or comment on issues.
#
# Trigger: only on release-tag PRs (tags matching v2-YYYY-MM-DD-NN).
# Manual workflow_dispatch is permitted for ad-hoc reproducibility testing.

name: AppImage reproducible build (Story 2-7)

on:
  push:
    tags:
      - 'v2-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
  pull_request:
    paths:
      - 'Telegram/build/release-linux-appimage.sh'
      - 'Telegram/build/sign-appimage-linux.sh'
      - 'Telegram/build/verify-appimage-contents.sh'
      - '.github/workflows/appimage-reproducible.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (v2-YYYY-MM-DD-NN)'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  ARTEFACT_NAME: Telegram-x86_64-v2.AppImage

jobs:
  build-matrix:
    name: build-ubuntu-22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config \
            patchelf squashfs-tools file desktop-file-utils \
            zsync libfuse2t64 wget

      - name: Pin AppImage toolchain (downloads + SHA-256 manifest)
        run: |
          sudo mkdir -p /opt/appimage
          cd /opt/appimage
          # Pinned URLs — release SHA may need updating if upstream
          # rotates; manifest divergence is the gate that catches it.
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          sudo chmod +x appimagetool linuxdeploy linuxdeploy-plugin-qt
          # Record SHAs for auditability. Set PINNED_* as repo-level Actions
          # secrets to enforce the gate; without them only the SHAs are logged.
          sha256sum appimagetool linuxdeploy linuxdeploy-plugin-qt | tee /tmp/tool-shas.txt
          if [[ -n "${PINNED_APPIMAGETOOL_SHA256:-}" ]]; then
            echo "${PINNED_APPIMAGETOOL_SHA256}  appimagetool" | sha256sum --check --status \
              || { echo "FAIL: appimagetool SHA mismatch — update PINNED_APPIMAGETOOL_SHA256"; exit 1; }
            echo "${PINNED_LINUXDEPLOY_SHA256}  linuxdeploy" | sha256sum --check --status \
              || { echo "FAIL: linuxdeploy SHA mismatch — update PINNED_LINUXDEPLOY_SHA256"; exit 1; }
            echo "${PINNED_LINUXDEPLOY_PLUGIN_QT_SHA256}  linuxdeploy-plugin-qt" | sha256sum --check --status \
              || { echo "FAIL: linuxdeploy-plugin-qt SHA mismatch — update PINNED_LINUXDEPLOY_PLUGIN_QT_SHA256"; exit 1; }
          else
            echo "WARNING: PINNED_* secrets not set — SHA gate skipped (populate from /tmp/tool-shas.txt)"
          fi

      - name: Build tdesktop AppDir (host build)
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          # Host-build path — invokes the centos_env build via docker
          # if available, else falls back to host cmake + ninja with
          # pinned compiler. AppDir is consumed by release-linux-appimage.sh.
          ./Telegram/build/prepare/linux.sh
          mkdir -p out/Release/AppDir/usr/bin
          cmake -S Telegram -B out/Release \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DTDESKTOP_API_ID=${TDESKTOP_API_ID} \
                -DTDESKTOP_API_HASH=${TDESKTOP_API_HASH} \
                -DTDESKTOP_LAUNCHER_BASENAME=org.ankuper.tdesktop \
                -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build out/Release --target Telegram
          DESTDIR="$PWD/out/Release/AppDir" cmake --install out/Release

      - name: Locate libteleproto3 lib + LICENSE
        id: locate-lib
        run: |
          LIB="$(find . -name 'libteleproto3.a' -type f | head -1)"
          [[ -f "$LIB" ]] || { echo "libteleproto3.a not built"; exit 1; }
          LIC="$(find . -path '*/teleproto3/lib/LICENSE' -type f | head -1)"
          [[ -f "$LIC" ]] || LIC=Telegram/Resources/LICENSE-libteleproto3
          [[ -f "$LIC" ]] || { echo "LICENSE-libteleproto3 missing"; exit 1; }
          echo "LIBTELEPROTO3_A=$LIB" >> "$GITHUB_ENV"
          echo "LICENSE_LIBTELEPROTO3=$LIC" >> "$GITHUB_ENV"

      - name: Run release-linux-appimage.sh
        run: |
          ./Telegram/build/release-linux-appimage.sh "${TAG}" "out/release-linux"

      - name: Run verify-appimage-contents.sh
        run: |
          ./Telegram/build/verify-appimage-contents.sh \
            "out/release-linux/${ARTEFACT_NAME}"

      - name: Static-link assertion (anti-pattern §12.10)
        run: |
          mkdir -p /tmp/extract && cd /tmp/extract
          "$GITHUB_WORKSPACE/out/release-linux/${ARTEFACT_NAME}" --appimage-extract >/dev/null
          ldd squashfs-root/usr/bin/Telegram | tee /tmp/ldd.out
          if grep -qi 'teleproto3' /tmp/ldd.out; then
            echo 'FAIL: libteleproto3 dynamically linked'
            exit 1
          fi

      - name: Upload artefacts (per-runner)
        uses: actions/upload-artifact@v4
        with:
          name: appimage-ubuntu-22.04
          path: |
            out/release-linux/${{ env.ARTEFACT_NAME }}
            out/release-linux/release-manifest-linux.txt
          if-no-files-found: error

  reproducibility-gate:
    name: reproducibility-gate
    runs-on: ubuntu-24.04
    needs: build-matrix
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: SHA-256 byte-equality assertion across runner classes
        run: |
          set -euo pipefail
          declare -A shas
          for d in artifacts/appimage-*; do
            runner="${d##*/}"
            sha="$(sha256sum "$d/${{ env.ARTEFACT_NAME }}" | awk '{print $1}')"
            shas["$runner"]="$sha"
            printf 'runner=%-20s sha256=%s\n' "$runner" "$sha"
          done
          if [[ "${#shas[@]}" -eq 0 ]]; then
            echo "FAIL: no runner artefacts found"
            exit 1
          fi
          if [[ "${#shas[@]}" -lt 2 ]]; then
            echo "INFO: single runner in matrix — cross-runner comparison skipped; add matrix runners for full reproducibility gate"
          else
            first=
            for runner in "${!shas[@]}"; do
              if [[ -z "$first" ]]; then
                first="${shas[$runner]}"; continue
              fi
              [[ "${shas[$runner]}" == "$first" ]] \
                || { echo "FAIL: $runner SHA-256 differs from baseline"; exit 1; }
            done
          fi
          echo "OK: all runner classes produced byte-identical AppImage"

      - name: Manifest cross-check
        run: |
          # release-manifest-linux.txt is part of the input set to
          # subsequent reproducibility runs — must also be byte-identical.
          first=
          for d in artifacts/appimage-*; do
            sha="$(sha256sum "$d/release-manifest-linux.txt" | awk '{print $1}')"
            if [[ -z "$first" ]]; then first="$sha"; continue; fi
            [[ "$sha" == "$first" ]] \
              || { echo "FAIL: release-manifest-linux.txt differs across runners"; exit 1; }
          done
          echo OK
